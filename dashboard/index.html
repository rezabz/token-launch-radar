<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar — pre-token protocols ranked by implied value</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#board-panel">Skip to the board</a>
<div id="app" aria-busy="true">
  <div class="shell">
    <header class="masthead">
      <div class="brand"><span class="pulse" aria-hidden="true"></span><span class="brand-word">TOKEN&nbsp;RADAR</span></div>
      <p class="masthead-sub">Pre-token protocols, ranked by implied value</p>
    </header>
    <main id="main">
      <section class="stats" id="stats" aria-label="Snapshot summary"></section>
      <section class="podium" id="podium" aria-label="Top three protocols"></section>
      <section class="panel model" id="model" aria-label="How implied value is computed"></section>
      <section class="controls" id="controls" aria-label="Board controls"></section>
      <section class="panel" id="board-panel" aria-label="Protocol board">
        <div class="table-wrap" id="table-wrap"></div>
      </section>
      <section class="panel live-panel" id="live-panel" aria-label="Already-trading protocols" hidden></section>
      <footer class="foot" id="foot"></footer>
    </main>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
